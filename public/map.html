<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Карта пасек, осадков и медоносных растений</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background: #f8fafc; color: #0f172a; }
    .page { max-width: 1280px; margin: 0 auto; padding: 16px; }
    header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 6px 0 16px; }
    h1 { font-size: 22px; margin: 0; }
    .back-link { color: #f97316; font-weight: 600; text-decoration: none; white-space: nowrap; }
    .back-link:hover { text-decoration: underline; }
    .activation { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    .activation-label { margin: 0 0 10px; font-weight: 600; font-size: 14px; }
    .activation-row { display: flex; flex-wrap: wrap; gap: 8px; }
    #sensor-code { flex: 1 1 240px; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 14px; }
    #sensor-code:focus { outline: 2px solid #f97316; outline-offset: 1px; border-color: #f97316; }
    #activate-btn { padding: 10px 18px; background: #f97316; color: #fff; border: 0; border-radius: 10px; font-weight: 600; font-size: 14px; cursor: pointer; }
    #activate-btn:hover { background: #ea580c; }
    #activation-msg { display: none; margin-top: 10px; padding: 10px 12px; border-radius: 10px; font-size: 14px; font-weight: 600; }
    .msg-green { background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; }
    .msg-red { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
    .msg-yellow { background: #fefce8; color: #a16207; border: 1px solid #fde68a; }
    .msg-gray { background: #f4f4f5; color: #52525b; border: 1px solid #e4e4e7; }
    #activated-list { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
    #activated-list li { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; font-size: 14px; }
    #activated-list li.empty { color: #64748b; border-style: dashed; background: transparent; }
    #activated-list button { margin-left: auto; padding: 5px 12px; background: #fff; color: #b91c1c; border: 1px solid #fecaca; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; }
    #activated-list button:hover { background: #fef2f2; }
    .legend { display: flex; flex-wrap: wrap; gap: 18px; margin-top: 14px; padding: 12px 16px; background: #fff; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.08); font-size: 14px; }
    .legend-item { display: inline-flex; align-items: center; gap: 8px; }
    .dot { width: 14px; height: 14px; border-radius: 50%; display: inline-block; flex: none; box-shadow: 0 0 0 2px rgba(255,255,255,.9), 0 1px 3px rgba(0,0,0,.2); }
    .dot-green { background: #22c55e; }
    .dot-red { background: #ef4444; }
    .dot-pink { background: #ec4899; }
    .dot-blue { background: #3b82f6; }
    #map-error { display: none; margin-top: 16px; padding: 16px; background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c; border-radius: 12px; font-weight: 600; }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <h1>🗺 Карта пасек, осадков и медоносных растений</h1>
      <a class="back-link" href="/">← На главную</a>
    </header>

    <section class="activation" aria-label="Активация датчиков">
      <p class="activation-label">Активируйте датчик, чтобы добавить пасеку на карту</p>
      <div class="activation-row">
        <input id="sensor-code" placeholder="Код датчика (например, SN-001)" autocomplete="off" />
        <button id="activate-btn" type="button">Активировать</button>
      </div>
      <div id="activation-msg" role="status"></div>
      <ul id="activated-list"></ul>
    </section>

    <div id="map" style="height:65vh;width:100%;border-radius:12px"></div>
    <div id="map-error">Не удалось загрузить карту</div>

    <div class="legend" aria-label="Легенда карты">
      <span class="legend-item"><span class="dot dot-green"></span> Пасеки (активированные датчики)</span>
      <span class="legend-item"><span class="dot dot-red"></span> Пестициды</span>
      <span class="legend-item"><span class="dot dot-pink"></span> Медоносные растения</span>
      <span class="legend-item"><span class="dot dot-blue"></span> Осадки (радар)</span>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.1.3/leaflet-maplibre-gl.js"></script>
  <script src="/js/map.js"></script>
</body>
</html>
